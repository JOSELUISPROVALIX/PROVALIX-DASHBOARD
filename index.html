var doughnutPctPlugin={
  id:'dPct',
  afterDatasetDraw:function(chart){
    var ctx=chart.ctx,data=chart.data;
    var total=data.datasets[0].data.reduce(function(a,b){return a+b;},0);
    chart.getDatasetMeta(0).data.forEach(function(arc,i){
      var val=data.datasets[0].data[i];
      var p=(val/total)*100;
      if(p<6)return;
      var pos=arc.tooltipPosition();
      ctx.save();ctx.font='bold 10px Segoe UI,sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(p.toFixed(0)+'%',pos.x,pos.y);ctx.restore();
    });
  }
};

function buildTbl(rows,totalBd,totalR){

    var row=rows[i],bd=row.bd||0,r=row.r||0,d=r-bd;
    var dc=d>0.4?'dp':d<-0.4?'dn':'';

    if(row.t==='cat'){

  h+='<tr class="tot"><td>Total general</td><td>'+fe(totalBd)+'</td><td>'+fe(totalR)+'</td><td class="'+tdc+'">'+(td>=0?'+':'')+fe(td)+'</td><td></td></tr>';

  charts.gas=new Chart(document.getElementById('cGas'),{type:'bar',data:{labels:gtoDet.map(function(r){return r.c.replace(/^\d+\.\d+\.?\d*\s/,'');}),datasets:[{label:'Pressupost',data:gtoDet.map(function(r){return Math.abs(r.bd||0);}),backgroundColor:BDA,borderColor:BD,borderWidth:1.5},{label:'Executat',data:gtoDet.map(function(r){return Math.abs(r.r||0);}),backgroundColor:REALA,borderColor:REAL,borderWidth:1.5}]},options:opts});
  var nullArr=[];for(var i=3;i<12;i++){nullArr.push(null);}
  charts.evo=new Chart(document.getElementById('cEvo'),{type:'line',data:{labels:BDM,datasets:[{label:'Acum. Pressupost',data:BDR_ACUM,borderColor:BD,backgroundColor:'rgba(44,62,84,0.08)',fill:true,tension:0.3,borderWidth:2.5,pointRadius:5,pointBackgroundColor:BD,pointBorderColor:'#fff',pointBorderWidth:2},{label:'Acum. Real',data:REALES_ACUM.concat(nullArr),borderColor:REAL,backgroundColor:'rgba(91,200,192,0.1)',fill:true,tension:0.3,borderWidth:3,pointRadius:8,pointBackgroundColor:REAL,pointBorderColor:'#fff',pointBorderWidth:2},{label:'Mensual BD',data:BDR_MES,borderColor:BD,borderDash:[5,4],tension:0.3,borderWidth:1.5,pointRadius:3,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+fe(c.raw);}}}},scales:{y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},callback:function(v){return '\u20AC'+Math.round(v/1000)+'k';},color:'#64748b'},title:{display:true,text:'Resultat Acumulat',font:{size:10,weight:'600'},color:'#64748b'}},x:{ticks:{font:{size:11,weight:'700'},color:'#2C3E54'}}}}});
  var gVals=gtoDet.map(function(r){return Math.abs(r.r||0);});
  var gTot=gVals.reduce(function(a,b){return a+b;},0);
  var legEl=document.getElementById('legPeso');
  if(legEl){var lh='';for(var i=0;i<gtoDet.length;i++){var p=((gVals[i]/gTot)*100).toFixed(1);lh+='<div class="li"><div class="ld" style="background:'+PESO_COLORS[i%PESO_COLORS.length]+'"></div>'+gtoDet[i].c.replace(/^\d+\.\d+\.?\d*\s/,'')+'&nbsp;<strong>'+p+'%</strong></div>';}legEl.innerHTML=lh;}
  charts.peso=new Chart(document.getElementById('cPeso'),{type:'doughnut',data:{labels:gtoDet.map(function(r){return r.c.replace(/^\d+\.\d+\.?\d*\s/,'');}),datasets:[{data:gVals,backgroundColor:PESO_COLORS,borderWidth:2,borderColor:'#fff',hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){var p=((c.raw/gTot)*100).toFixed(1);return c.label+': '+fe(c.raw)+' ('+p+')%';}}}}}});
  var bVals=[5191540,1158920,772534,182570,568749];
  var bTot=bVals.reduce(function(a,b){return a+b;},0);
  charts.bal=new Chart(document.getElementById('cBal'),{type:'doughnut',data:{labels:['Inv. EEGG LP','Actiu corrent','Inv. Immobles','Immobilitzat','Altres'],datasets:[{data:bVals,backgroundColor:['#2C3E54','#5BC8C0','#3d5268','#7fb3c8','#b5d9e4'],borderWidth:2,borderColor:'#fff',hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'bottom',labels:{font:{size:10},color:'#64748b',boxWidth:10,padding:8,generateLabels:function(chart){return chart.data.labels.map(function(l,i){return{text:l+' '+(chart.data.datasets[0].data[i]/bTot*100).toFixed(1)+'%',fillStyle:chart.data.datasets[0].backgroundColor[i],strokeStyle:'#fff',lineWidth:1,index:i};});}}}}}});
}

function renderCmp(){
  var h='<div class="ph"><h2>Comparatiu YTD &mdash; Variacio entre Periodes</h2></div>';
  h+='<div class="cc" style="margin-bottom:16px;flex-direction:row;align-items:center;gap:16px">';
  h+='<label style="font-size:11px;font-weight:700;color:#2C3E54">Comparar</label>';
  h+='<select class="csel" id="selA"><option value="0">YTD Gener 2026</option><option value="1">YTD Febrer 2026</option><option value="2" selected>YTD Marc 2026</option></select>';
  h+='<span class="cvs">VS</span>';
  h+='<select class="csel" id="selB"><option value="0" selected>YTD Gener 2026</option><option value="1">YTD Febrer 2026</option><option value="2">YTD Marc 2026</option></select>';
  h+='<button onclick="updateCmp()" style="padding:5px 14px;background:#2C3E54;color:#fff;border:none;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer">Actualitzar</button>';
  h+='</div><div id="cmpTbl"></div>';
  document.getElementById('CT').innerHTML=h;
  updateCmp();
}

function ytdOf(idx){
  var months=D.slice(0,idx+1).filter(function(d){return d.id<=3;});
  var res={lbl:'YTD '+D[idx].lbl,bdi:0,ri:0,bdg:0,rg:0,bdr:0,rr:0,ing:[],gto:[]};
  for(var i=0;i<months.length;i++){res.bdi+=months[i].bdi;res.ri+=months[i].ri;res.bdg+=months[i].bdg;res.rg+=months[i].rg;res.bdr+=months[i].bdr;res.rr+=months[i].rr;}
  res.ing=aggLines(months,'ing');
  res.gto=aggLines(months,'gto');
  return res;
}

function aggLines(months,key){
  var map={},order=[];
  for(var m=0;m<months.length;m++){
    var rows=months[m][key];
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(!map[r.c]){map[r.c]={c:r.c,t:r.t,bd:0,r:0};order.push(r.c);}
      map[r.c].bd+=(r.bd||0);map[r.c].r+=(r.r||0);
    }
  }
  return order.map(function(c){return map[c];});
}

function updateCmp(){
  var iA=parseInt(document.getElementById('selA').value);
  var iB=parseInt(document.getElementById('selB').value);
  if(iA===iB){document.getElementById('cmpTbl').innerHTML='<div style="padding:16px;color:#64748b">Selecciona dos periodes diferents.</div>';return;}
  var later=iA>iB?ytdOf(iA):ytdOf(iB);
  var earlier=iA>iB?ytdOf(iB):ytdOf(iA);
  var dI=later.ri-earlier.ri,dG=later.rg-earlier.rg,dR=later.rr-earlier.rr;
  var dBI=later.bdi-earlier.bdi,dBG=later.bdg-earlier.bdg,dBR=later.bdr-earlier.bdr;
  var ingL=later.ing.filter(function(r){return r.t==='det';});
  var ingE=earlier.ing.filter(function(r){return r.t==='det';});
  var gtoL=later.gto.filter(function(r){return r.t==='det';});
  var gtoE=earlier.gto.filter(function(r){return r.t==='det';});
  function compR(lR,eR){
    var all={};var ord=[];
    for(var i=0;i<lR.length;i++){if(!all[lR[i].c]){all[lR[i].c]={c:lR[i].c.replace(/^\d+\.\d+\.?\d*\s/,''),eBd:0,eR:0,lBd:0,lR:0};ord.push(lR[i].c);}all[lR[i].c].lBd=lR[i].bd;all[lR[i].c].lR=lR[i].r;}
    for(var i=0;i<eR.length;i++){if(!all[eR[i].c]){all[eR[i].c]={c:eR[i].c.replace(/^\d+\.\d+\.?\d*\s/,''),eBd:0,eR:0,lBd:0,lR:0};ord.push(eR[i].c);}all[eR[i].c].eBd=eR[i].bd;all[eR[i].c].eR=eR[i].r;}
    return ord.map(function(k){var x=all[k];return {c:x.c,eBd:x.eBd,eR:x.eR,lBd:x.lBd,lR:x.lR,dR:x.lR-x.eR,dBd:x.lBd-x.eBd};});
  }
  var iRows=compR(ingL,ingE);
  var gRows=compR(gtoL,gtoE);
  function tRows(rows){
    var h='';
    for(var i=0;i<rows.length;i++){
      var r=rows[i];var dc=r.dR>0.4?'dp':r.dR<-0.4?'dn':'';
      h+='<tr><td>'+r.c+'</td><td>'+fe(r.eBd)+'</td><td>'+fe(r.eR)+'</td><td>'+fe(r.lBd)+'</td><td>'+fe(r.lR)+'</td>';
      h+='<td class="'+dc+'">'+(r.dR>=0?'+':'')+fe(r.dR)+'</td><td class="'+(r.dBd>=0?'dp':'dn')+'">'+(r.dBd>=0?'+':'')+fe(r.dBd)+'</td></tr>';
    }
    return h;
  }
  var h='<div class="sec">Resum executiu &mdash; Variacio real</div>';
  h+='<table class="ct2"><thead><tr><th style="text-align:left;min-width:180px">Concepte</th><th>'+earlier.lbl+' BD</th><th>'+earlier.lbl+' Real</th><th>'+later.lbl+' BD</th><th>'+later.lbl+' Real</th><th>&#916; Real</th><th>&#916; Budget</th></tr></thead><tbody>';
  h+='<tr class="hdr"><td>INGRESSOS TOTALS</td><td>'+fe(earlier.bdi)+'</td><td>'+fe(earlier.ri)+'</td><td>'+fe(later.bdi)+'</td><td>'+fe(later.ri)+'</td><td class="'+(dI>=0?'dp':'dn')+'">'+(dI>=0?'+':'')+fe(dI)+'</td><td class="'+(dBI>=0?'dp':'dn')+'">'+(dBI>=0?'+':'')+fe(dBI)+'</td></tr>';
  h+=tRows(iRows);
  h+='<tr class="hdr"><td>GASTOS TOTALS</td><td>'+fe(earlier.bdg)+'</td><td>'+fe(earlier.rg)+'</td><td>'+fe(later.bdg)+'</td><td>'+fe(later.rg)+'</td><td class="'+(dG<=0?'dp':'dn')+'">'+(dG>=0?'+':'')+fe(dG)+'</td><td class="'+(dBG<=0?'dp':'dn')+'">'+(dBG>=0?'+':'')+fe(dBG)+'</td></tr>';
  h+=tRows(gRows);
  h+='<tr class="tr2"><td>RESULTAT GESTIO</td><td>'+fe(earlier.bdr)+'</td><td style="color:'+(earlier.rr>=0?'#5BC8C0':'#ff6b6b')+'">'+fe(earlier.rr)+'</td><td>'+fe(later.bdr)+'</td><td style="color:'+(later.rr>=0?'#5BC8C0':'#ff6b6b')+'">'+fe(later.rr)+'</td><td style="color:'+(dR>=0?'#5BC8C0':'#ff6b6b')+'">'+(dR>=0?'+':'')+fe(dR)+'</td><td style="color:'+(dBR>=0?'#5BC8C0':'#ff6b6b')+'">'+(dBR>=0?'+':'')+fe(dBR)+'</td></tr>';
  h+='</tbody></table>';
  document.getElementById('cmpTbl').innerHTML=h;
}

render(D[0]);
</script>
