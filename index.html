function ytdOf(idx){
  var months=D.slice(0,idx+1).filter(function(d){return d.id<=3;});
  var res={lbl:'YTD '+D[idx].lbl,bdi:0,ri:0,bdg:0,rg:0,bdr:0,rr:0,ing:[],gto:[]};
  for(var i=0;i<months.length;i++){res.bdi+=months[i].bdi;res.ri+=months[i].ri;res.bdg+=months[i].bdg;res.rg+=months[i].rg;res.bdr+=months[i].bdr;res.rr+=months[i].rr;}
  res.ing=aggLines(months,'ing');
  res.gto=aggLines(months,'gto');
  return res;
}

function aggLines(months,key){
  var map={},order=[];
  for(var m=0;m<months.length;m++){
    var rows=months[m][key];
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(!map[r.c]){map[r.c]={c:r.c,t:r.t,bd:0,r:0};order.push(r.c);}
      map[r.c].bd+=(r.bd||0);map[r.c].r+=(r.r||0);
    }
  }
  return order.map(function(c){return map[c];});
}

function updateCmp(){
  var iA=parseInt(document.getElementById('selA').value);
  var iB=parseInt(document.getElementById('selB').value);
  if(iA===iB){document.getElementById('cmpTbl').innerHTML='<div style="padding:16px;color:#64748b">Selecciona dos periodes diferents.</div>';return;}
  var later=iA>iB?ytdOf(iA):ytdOf(iB);
  var earlier=iA>iB?ytdOf(iB):ytdOf(iA);
  var dI=later.ri-earlier.ri,dG=later.rg-earlier.rg,dR=later.rr-earlier.rr;
  var dBI=later.bdi-earlier.bdi,dBG=later.bdg-earlier.bdg,dBR=later.bdr-earlier.bdr;
  var ingL=later.ing.filter(function(r){return r.t==='det';});
  var ingE=earlier.ing.filter(function(r){return r.t==='det';});
  var gtoL=later.gto.filter(function(r){return r.t==='det';});
  var gtoE=earlier.gto.filter(function(r){return r.t==='det';});
  function compR(lR,eR){
    var all={};var ord=[];
    for(var i=0;i<lR.length;i++){if(!all[lR[i].c]){all[lR[i].c]={c:lR[i].c.replace(/^\d+\.\d+\.?\d*\s/,''),eBd:0,eR:0,lBd:0,lR:0};ord.push(lR[i].c);}all[lR[i].c].lBd=lR[i].bd;all[lR[i].c].lR=lR[i].r;}
    for(var i=0;i<eR.length;i++){if(!all[eR[i].c]){all[eR[i].c]={c:eR[i].c.replace(/^\d+\.\d+\.?\d*\s/,''),eBd:0,eR:0,lBd:0,lR:0};ord.push(eR[i].c);}all[eR[i].c].eBd=eR[i].bd;all[eR[i].c].eR=eR[i].r;}
    return ord.map(function(k){var x=all[k];return {c:x.c,eBd:x.eBd,eR:x.eR,lBd:x.lBd,lR:x.lR,dR:x.lR-x.eR,dBd:x.lBd-x.eBd};});
  }
  var iRows=compR(ingL,ingE);
  var gRows=compR(gtoL,gtoE);
  function tRows(rows){
    var h='';
    for(var i=0;i<rows.length;i++){
      var r=rows[i];var dc=r.dR>0.4?'dp':r.dR<-0.4?'dn':'';
      h+='<tr><td>'+r.c+'</td><td>'+fe(r.eBd)+'</td><td>'+fe(r.eR)+'</td><td>'+fe(r.lBd)+'</td><td>'+fe(r.lR)+'</td>';
      h+='<td class="'+dc+'">'+(r.dR>=0?'+':'')+fe(r.dR)+'</td><td class="'+(r.dBd>=0?'dp':'dn')+'">'+(r.dBd>=0?'+':'')+fe(r.dBd)+'</td></tr>';
    }
    return h;
  }
  var h='<div class="sec">Resum executiu &mdash; Variacio real</div>';
  h+='<table class="ct2"><thead><tr><th style="text-align:left;min-width:180px">Concepte</th><th>'+earlier.lbl+' BD</th><th>'+earlier.lbl+' Real</th><th>'+later.lbl+' BD</th><th>'+later.lbl+' Real</th><th>&#916; Real</th><th>&#916; Budget</th></tr></thead><tbody>';
  h+='<tr class="hdr"><td>INGRESSOS TOTALS</td><td>'+fe(earlier.bdi)+'</td><td>'+fe(earlier.ri)+'</td><td>'+fe(later.bdi)+'</td><td>'+fe(later.ri)+'</td><td class="'+(dI>=0?'dp':'dn')+'">'+(dI>=0?'+':'')+fe(dI)+'</td><td class="'+(dBI>=0?'dp':'dn')+'">'+(dBI>=0?'+':'')+fe(dBI)+'</td></tr>';
  h+=tRows(iRows);
  h+='<tr class="hdr"><td>GASTOS TOTALS</td><td>'+fe(earlier.bdg)+'</td><td>'+fe(earlier.rg)+'</td><td>'+fe(later.bdg)+'</td><td>'+fe(later.rg)+'</td><td class="'+(dG<=0?'dp':'dn')+'">'+(dG>=0?'+':'')+fe(dG)+'</td><td class="'+(dBG<=0?'dp':'dn')+'">'+(dBG>=0?'+':'')+fe(dBG)+'</td></tr>';
  h+=tRows(gRows);
  h+='<tr class="tr2"><td>RESULTAT GESTIO</td><td>'+fe(earlier.bdr)+'</td><td style="color:'+(earlier.rr>=0?'#5BC8C0':'#ff6b6b')+'">'+fe(earlier.rr)+'</td><td>'+fe(later.bdr)+'</td><td style="color:'+(later.rr>=0?'#5BC8C0':'#ff6b6b')+'">'+fe(later.rr)+'</td><td style="color:'+(dR>=0?'#5BC8C0':'#ff6b6b')+'">'+(dR>=0?'+':'')+fe(dR)+'</td><td style="color:'+(dBR>=0?'#5BC8C0':'#ff6b6b')+'">'+(dBR>=0?'+':'')+fe(dBR)+'</td></tr>';
  h+='</tbody></table>';
  document.getElementById('cmpTbl').innerHTML=h;
}

render(D[0]);
</script>
